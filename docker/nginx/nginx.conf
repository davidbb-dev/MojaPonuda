# Nginx handles incoming HTTP requests and serves static files
# or forwards PHP requests to PHP-FPM.
server {
    listen 80;
    index index.php index.html;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Route unknown paths through the application front controller.
    error_page 404 /index.php;

    root /var/www/public;

    # ---------------------------------------------------------
    # Upload limits and timeouts
    # ---------------------------------------------------------
    # Keep this slightly above PHP post_max_size to allow for
    # multipart/form-data request overhead.
    client_max_body_size 70M;

    # Amount of request-body data buffered in memory before
    # Nginx may use a temporary file.
    client_body_buffer_size 1M;

    # Maximum time Nginx waits for the client to send the request body.
    client_body_timeout 120s;

    # Timeouts for communication with PHP-FPM and the client.
    fastcgi_read_timeout 120s;
    send_timeout 120s;

    # ---------------------------------------------------------
    # Gzip compression for text-based assets
    # ---------------------------------------------------------
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------
    # Static assets
    # ---------------------------------------------------------
    location ~* \.(?:css|js|jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ---------------------------------------------------------
    # PHP requests
    # ---------------------------------------------------------
    location ~ \.php$ {
        # Only pass existing PHP files to PHP-FPM.
        try_files $uri =404;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        # Tell PHP-FPM which physical PHP file to execute.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Buffers for responses received from PHP-FPM.
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ---------------------------------------------------------
    # Application routes
    # ---------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Defense in depth: never execute PHP files from uploads.
    location ~* /uploads/.*\.php$ {
        deny all;
    }
}