; =========================================================
; PHP upload and execution limits for large image uploads.
;
; post_max_size must be >= upload_max_filesize.
; Nginx client_max_body_size must be >= post_max_size.
; =========================================================

upload_max_filesize = 64M
post_max_size = 66M

memory_limit = 256M

; Allow multiple images to be uploaded at once.
max_file_uploads = 30

; Allow more time for large uploads and image processing.
max_execution_time = 120
max_input_time = 120

; Do not expose PHP errors to users.
display_errors = Off

; Log PHP errors for debugging.
log_errors = On
error_log = /var/log/php_errors.log